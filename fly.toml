# Fly.io config for the one-container build (Dockerfile): the game server also serves the website,
# so the page and its WebSocket share one origin. See docs/DEPLOY.md.
#
# One machine is one 12-player room. Keep a single machine per region: two machines behind the
# same address would split players into separate rooms at random.

app = "splat-arena"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  ALLOWED_ORIGINS = "https://splat-arena.fly.dev"

# the server closes every connection with "server restarting" and exits on SIGTERM
kill_signal = "SIGTERM"
kill_timeout = 5

[http_service]
  internal_port = 8080
  force_https = true
  # stop the machine when nobody is connected (an open game connection keeps it running) and
  # start it again on the next visit; first load after idle takes a couple of seconds
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 60

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
